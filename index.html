<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Select & Panel App</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
        margin: 0;
        padding: 20px;
      }
      h1 {
        color: #333;
      }

      .example {
        margin: 20px 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      my-select {
        --host-select-primary-color: #ff5733;
        --host-select-popup-background: #f0f0f0;
        --host-select-button-border-radius: 6px;
        --host-select-popup-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      my-panel {
        --host-panel-border: 1px solid #ddd;
        --host-panel-border-radius: 8px;
        --host-panel-background: #fff;
        --host-panel-header-bg: #f5f5f5;
        --host-panel-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        --host-panel-primary-color: #007bff;
      }

      .my-panel-scrollable-content {
        min-height: 200px;
        padding: 10px;
      }

      my-card {
        --host-card-border: 1px solid #ddd;
        --host-card-border-radius: 8px;
        --host-card-background: #fff;
        --host-card-header-bg: #f5f5f5;
        --host-card-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        --host-card-sub-header-bg: #fafafa;
        --host-card-sub-header-color: #666;
      }
    </style>
  </head>
  <body>
    <h1>Пример приложения с веб-компонентом my-select и my-panel</h1>

    <div class="example">
      <!-- контейнер для динамически добавляемого веб-компонента -->
    </div>

    <script>
      const onLoad = (evt) => {
        const loadedScript = evt.target;
        const componentName = loadedScript.dataset.name;

        if (componentName === "my-select") {
          const el = document.createElement(componentName);
          el.innerHTML = `
              <div slot="search">
                <input class="select-popup-search" placeholder="Поиск..." />
              </div>
			        <option value="opt1">Option 1</option>
			        <option value="opt2">Option 2</option>
			        <option value="opt3">Option 3</option>
			    `;

          const panel = document.createElement("my-panel");
          panel.setAttribute("toggleable", "true");
          panel.setAttribute("collapsed", "false");
          panel.innerHTML = `
            <div slot="header">My Custom Select Panel</div>
            <div class="my-panel-scrollable-content">
                <span>Multiselect field</span>
            </div>
          `;

          const contentDiv = panel.querySelector('.my-panel-scrollable-content');
          contentDiv.appendChild(el);

          document.querySelector(".example").appendChild(panel);
        } else if (componentName === "my-card") {
          const card = document.createElement(componentName);
          card.setAttribute("header", "Advanced Card");
          card.setAttribute("sub-header", "Subtitle text");
          card.innerHTML = `
            <div slot="content">
              <p>This is the main content of the card.</p>
            </div>
            <div slot="footer">
              <button>Action Button</button>
            </div>
          `;

          document.querySelector(".example").appendChild(card);
        }
      };

      const onError = (err) => {
        console.error(`Ошибка загрузки скрипта: ${err}`);
      };

      const components = ["my-select", "my-panel", "my-card"];
      components.forEach((component) => {
        const script = document.createElement("script");
        script.src = `./${component}.js`;
        script.dataset.name = component;
        script.addEventListener("load", onLoad);
        document.body.append(script);
      });
    </script>
  </body>
</html>
